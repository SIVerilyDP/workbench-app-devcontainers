services:
  app:
    container_name: "application-server"
    image: "python:3.11-slim"
    restart: always
    volumes:
      - .:/workspace:cached
      - work:/root/work
    ports:
      - 8080:8080
    command: ["bash", "-c", "pip install -q --no-cache-dir -r /workspace/requirements.txt && cd /workspace && exec python main.py"]
    networks:
      - app-network
    # Optional: auto-fetch OpenAI key from Secret Manager on startup
    # environment:
    #   OPENAI_SECRET_PROJECT: "wb-smart-cabbage-5940"
    #   OPENAI_SECRET_NAME: "si-ops-openai-api-key"
    #   OPENAI_SECRET_VERSION: "latest"

volumes:
  work:

networks:
  app-network:
    name: app-network
    driver: bridge
